name: Build iOS IPA

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install -g eas-cli
          npm install

      - name: Expo Prebuild & Build iOS
        run: |
          npx expo prebuild --platform ios
          cd ios && xcodebuild -workspace iheat.xcworkspace -scheme iheat -configuration Release -sdk iphonesimulator CONFIGURATION_BUILD_DIR=build

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: iheat-app-build
          path: ios/build/
